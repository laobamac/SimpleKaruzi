name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            artifact_name: SimpleKaruzi-Windows
            asset_name: SimpleKaruzi-Windows.zip
          - os: macos-15-intel
            os_name: macOS-Intel
            artifact_name: SimpleKaruzi-macOS-Intel
            asset_name: SimpleKaruzi-macOS-Intel.zip

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pillow

    - name: Generate Icon (Windows)
      if: runner.os == 'Windows'
      run: |
        python -c "from PIL import Image; Image.open('icon.png').save('icon.ico')"

    - name: Compile Translations
      run: |
        python Scripts/build_translations.py

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "SimpleKaruzi" --add-data "Translations;Translations" --add-data "icon.png;." --add-data "Scripts/iasl.exe;Scripts" --add-data "Scripts/acpidump.exe;Scripts" --add-data "Scripts/macserial.exe;Scripts" --add-data "Scripts/Hardware-Sniffer-CLI.exe;Scripts" --icon "icon.ico" --hidden-import "PyQt6.sip" SimpleKaruzi.py

    - name: Build with PyInstaller (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "SimpleKaruzi" --add-data "Translations:Translations" --add-data "icon.png:." --add-data "Scripts/iasl-stable:Scripts" --add-data "Scripts/macserial:Scripts" --icon "icon.icns" --hidden-import "PyQt6.sip" --target-architecture x86_64 SimpleKaruzi.py

    - name: Archive Release (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Compress-Archive -Path dist/SimpleKaruzi.exe -DestinationPath dist/${{ matrix.asset_name }}

    - name: Archive Release (macOS)
      if: runner.os == 'macOS'
      run: |
        cd dist
        zip -r ${{ matrix.asset_name }} SimpleKaruzi.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.asset_name }}
        retention-days: 5

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: SimpleKaruzi-Windows
        path: ./artifacts

    - name: Download macOS Artifact
      uses: actions/download-artifact@v4
      with:
        name: SimpleKaruzi-macOS-Intel
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/SimpleKaruzi-Windows.zip
          ./artifacts/SimpleKaruzi-macOS-Intel.zip
        generate_release_notes: true
        draft: false
        prerelease: false
